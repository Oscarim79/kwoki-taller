<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Taller KWOKI · Próximamente</title>
  <meta name="description" content="El taller de la familia KWOKI todavía se está armando, capa por capa.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600&display=swap">
  <style>
    :root {
      --crema: #F7F6F2; --tinta: #1B1A3A; --tenue: #55546E;
      --amarillo: #F9D030; --fucsia: #F62AA0; --neon: #B8EE30; --aqua: #26DFD0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--crema); color: var(--tinta);
      font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.125rem; line-height: 1.55;
      display: grid; place-items: center; min-height: 100dvh; padding: 32px 16px;
    }
    main { max-width: 34rem; text-align: center; }
    .kwoki { width: 168px; height: 168px; display: block; margin: 0 auto 20px; }
    h1 { font-family: Fredoka, Nunito, sans-serif; font-weight: 700; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; margin: 0 0 8px; letter-spacing: 0.01em; }
    .capas { display: flex; justify-content: center; gap: 10px; margin: 14px 0 26px; }
    .capas span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tinta); display: inline-block; }
    p { margin: 0 0 14px; }
    .pronto { display: inline-block; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 1.35rem; padding: 2px 12px; border-radius: 10px; background: var(--amarillo); color: var(--tinta); }
    a { color: var(--tinta); font-weight: 600; text-decoration: underline; text-decoration-color: var(--aqua); text-decoration-thickness: 3px; text-underline-offset: 3px; }
    a:hover, a:focus-visible { text-decoration-color: var(--fucsia); outline: none; }
    footer { margin-top: 40px; color: var(--tenue); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <img class="kwoki" src="kwoki/cara-color.svg" alt="Kwoki, la mascota de KWOKI" width="168" height="168">
    <h1>Taller KWOKI</h1>
    <div class="capas" aria-hidden="true">
      <span style="background: var(--amarillo)"></span>
      <span style="background: var(--fucsia)"></span>
      <span style="background: var(--neon)"></span>
      <span style="background: var(--aqua)"></span>
    </div>
    <p>Aquí va a estar el taller de la familia KWOKI: los pedidos, las impresiones y las cuentas. Todavía lo estamos armando, capa por capa.</p>
    <p><span class="pronto">Muy pronto</span></p>
    <p>Mientras tanto, los juguetes están en <a href="https://kwokitoys.com">kwokitoys.com</a>.</p>
    <footer>KWOKI · juguetes impresos en 3D, en Guatemala</footer>
  </main>
</body>
</html>
